[project]
name = "flyrail"
version = "0.1.0"
description = "Bring-your-own-frontend server-driven UI core (reactpy-style API, transport agnostic)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aaron Lipinski", email = "kris.lipinski@gmail.com" }]
keywords = ["ui", "server-driven-ui", "websocket", "asgi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/krisl/flyrail"
Repository = "https://github.com/krisl/flyrail"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The repo root holds flyrail/, js/, docs/, example/ and tests/: a flat layout
# with more than one candidate top-level package. setuptools refuses to guess
# between them, so auto-discovery aborts the build. Name the one package.
[tool.setuptools]
packages = ["flyrail"]
