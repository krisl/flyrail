#  Release via CI: bump `version` in pyproject.toml, commit, then
#    `git tag vX.Y.Z && git push origin vX.Y.Z` -> watch Actions -> publish.
#  Manual escape hatch: `uv build`, then
#    `UV_PUBLISH_TOKEN=<pypi-token> uv publish dist/*`
#  Do NOT push a tag for a version already uploaded manually:
#  the job would fail trying to re-upload it. Tag the next version instead.
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
